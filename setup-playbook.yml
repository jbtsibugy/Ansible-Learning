---
- name: Basic System Setup
  hosts: web
  become: true
  tasks:
    - name: Update all secuirty-related packages
      ansible.builtin.package:
        name: '*'
        state: latest
        security: true 
    
    - name: Create new user
      ansible.builtin.user:
        name: roger
        state: present
        create_home: true 